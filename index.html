<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Покер-совет">
<title>Покер · совет</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <h1>Покер <em>·</em> совет</h1>
    <div class="top-actions">
      <span class="street" id="street">Префлоп</span>
      <button class="icon-btn" id="settings-btn" aria-label="Настройки блайндов">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>
  <button class="stakes" id="stakes" aria-label="Блайнды и твой стек — изменить"></button>

  <main>
    <section class="table-wrap" id="table" aria-label="Стол">
      <div class="rail"><div class="felt"></div></div>
      <div class="center">
        <div class="board" id="board"></div>
        <button class="pot-chip" id="pot-chip" aria-label="Банк — изменить"></button>
      </div>
    </section>
    <p class="hint">Нажми на место: ты, кнопка, пусто · <b>D</b> можно тянуть пальцем</p>
    <section class="hand" id="hand">
      <div class="hide-tab" id="hide-tab" aria-hidden="true"></div>
      <div class="hero-cards" id="hero-cards"></div>
      <div class="hero-info">
        <div class="hero-pos" id="hero-pos"></div>
        <button class="new-hand" id="new-hand">Новая раздача</button>
      </div>
    </section>
    <section class="inputs" id="inputs"></section>
  </main>
  <aside class="ticket" id="ticket" aria-live="polite"></aside>
  <div class="dim" id="dim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
