<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вариант A — Неон</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Saira:ital,wght@0,500;0,700;1,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06070d; --panel: #0e1120; --line: #1f2540; --text: #e9ecff; --muted: #8d93b8;
    --neon: #22f2c4; --hot: #ff3d8b; --gold: #ffc53d;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 500 15px/1.35 Saira, system-ui, sans-serif;
         min-height: 100vh; overflow: hidden; }
  ::selection { background: var(--hot); color: #fff; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 54px 18px 8px; }
  .logo { font: italic 800 19px/1 Saira; letter-spacing: -0.02em; transform: skewX(-6deg); }
  .logo span { color: var(--neon); }
  .new { font: 700 13px Saira; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; }
  .streets { display: flex; gap: 6px; padding: 6px 18px 0; }
  .streets div { flex: 1; text-align: center; font: 600 13px 'Saira Condensed'; text-transform: uppercase;
                 letter-spacing: .06em; color: var(--muted); padding: 7px 0; border-radius: 8px; background: var(--panel); }
  .streets .on { color: #04110d; background: var(--neon); }

  .table-wrap { position: relative; width: 358px; height: 300px; margin: 30px auto 0; }
  .felt { position: absolute; left: var(--sx); top: var(--sy); width: var(--sw); height: var(--sh); border-radius: 999px;
          background: radial-gradient(ellipse at 50% 40%, #0d2a2a 0%, #081419 70%);
          border: 2px solid var(--neon);
          box-shadow: 0 0 0 6px #0a1018, 0 0 28px rgba(34,242,196,.35), inset 0 0 40px rgba(34,242,196,.12); }
  .center { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 8px; }
  .board { display: flex; gap: 4px; }
  .pot { font: 700 13px 'Saira Condensed'; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  .pot b { color: var(--gold); font-size: 16px; margin-left: 4px; }
  .seat { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 3px; }
  .seat .disc { width: 44px; height: 44px; border-radius: 50%; background: var(--panel); border: 1.5px solid var(--line);
                display: grid; place-items: center; font: 800 14px 'Saira Condensed'; color: var(--text); }
  .seat .name { position: absolute; top: -9px; right: -7px; min-width: 18px; height: 18px; border-radius: 9px; background: #1d2238; font: 700 11px/18px 'Saira Condensed'; color: var(--muted); text-align: center; }
  .seat.is-hero .name { background: var(--hot); color: #fff; }
  .croupier { position: absolute; transform: translate(-50%, -50%); font: 700 11px 'Saira Condensed'; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border: 1px dashed #2e3556; border-radius: 8px; padding: 5px 8px; background: var(--bg); }
  .seat.is-hero .disc { border-color: var(--hot); box-shadow: 0 0 16px rgba(255,61,139,.55); color: var(--hot); }
  .seat.is-out { opacity: .35; }
  .seat.is-out .disc { border-style: dashed; color: var(--muted); text-decoration: line-through; }
  .dealer { position: absolute; transform: translate(-50%, -50%); width: 26px; height: 26px; border-radius: 50%;
            background: var(--gold); color: #1a1200; font: 800 13px Saira; display: grid; place-items: center;
            box-shadow: 0 0 14px rgba(255,197,61,.7), 0 2px 4px rgba(0,0,0,.6); }
  .hint { position: absolute; bottom: 0; width: 100%; text-align: center; font-size: 12px; color: var(--muted); }

  .card { width: 34px; height: 48px; border-radius: 6px; background: #f4f5fb; display: inline-grid;
          align-content: center; justify-items: center; line-height: 1; box-shadow: 0 3px 8px rgba(0,0,0,.5); }
  .card b { font: 800 17px 'Saira Condensed'; }
  .card i { font-style: normal; font-size: 15px; }
  .suit-s { color: #10121c; } .suit-c { color: #10121c; } .suit-h, .suit-d { color: #e0194f; }
  .card.empty { background: transparent; border: 1.5px dashed #2e3556; box-shadow: none; }
  .card.big { width: 52px; height: 72px; border-radius: 9px; }
  .card.big b { font-size: 25px; } .card.big i { font-size: 21px; }

  .me { display: flex; align-items: center; gap: 14px; padding: 12px 18px 0; }
  .me .cards { display: flex; gap: 6px; }
  .money { flex: 1; display: grid; gap: 6px; }
  .field { display: flex; justify-content: space-between; align-items: center; background: var(--panel);
           border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 13px; color: var(--muted); }
  .field b { color: var(--text); font: 700 17px Saira; }

  .verdict { position: absolute; left: 12px; right: 12px; bottom: 26px; border-radius: 18px; padding: 14px 16px 14px;
             background: linear-gradient(180deg, #1a0b18, #12091a); border: 1px solid rgba(255,61,139,.45);
             box-shadow: 0 10px 40px rgba(255,61,139,.18); }
  .verdict .row { display: flex; align-items: baseline; justify-content: space-between; }
  .action { font: italic 800 38px/1 Saira; letter-spacing: -0.02em; transform: skewX(-6deg); color: #fff; }
  .action span { color: var(--hot); }
  .eq { font: 800 30px/1 'Saira Condensed'; color: var(--neon); }
  .eq small { font-size: 13px; color: var(--muted); font-weight: 600; margin-left: 4px; }
  .bar { position: relative; height: 6px; border-radius: 3px; background: #2a2140; margin: 10px 0 8px; overflow: visible; }
  .bar .fill { position: absolute; inset: 0 61% 0 0; border-radius: 3px; background: var(--neon); }
  .bar .need { position: absolute; left: 20%; top: -4px; width: 2px; height: 14px; background: #fff; }
  .tags { display: flex; gap: 6px; margin-bottom: 6px; }
  .tags span { font: 600 12px 'Saira Condensed'; letter-spacing: .04em; padding: 3px 8px; border-radius: 6px; background: #241a36; color: #d9c8ff; }
  .why { font-size: 13.5px; color: #c9c3dc; }

  /* Выбор карты: сначала номинал, потом масть */
  .sheet-dim { display: none; position: fixed; inset: 0; background: rgba(3,4,10,.72); }
  .sheet { display: none; position: fixed; left: 0; right: 0; bottom: 0; background: #0d1020; border-top: 1px solid var(--line);
           border-radius: 22px 22px 0 0; padding: 12px 16px 34px; }
  .show-picker .sheet-dim, .show-picker .sheet { display: block; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: #2e3556; margin: 0 auto 12px; }
  .sheet h2 { font: italic 800 22px Saira; transform: skewX(-6deg); margin-bottom: 4px; }
  .sheet p { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .ranks { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; margin-bottom: 14px; }
  .ranks div { height: 50px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line);
               display: grid; place-items: center; font: 800 21px 'Saira Condensed'; }
  .ranks .on { background: var(--neon); color: #04110d; border-color: var(--neon); box-shadow: 0 0 16px rgba(34,242,196,.5); }
  .suits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .suits div { height: 70px; border-radius: 14px; background: #f4f5fb; display: grid; place-items: center; font-size: 34px; }
  .suits .used { opacity: .25; }
  .chosen { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <header><div class="logo">ПОКЕР<span>·</span>ПОДСКАЗЧИК</div><div class="new">Новая раздача</div></header>
  <div class="streets"><div>Префлоп</div><div class="on">Флоп</div><div>Тёрн</div><div>Ривер</div></div>

  <div class="table-wrap" id="table">
    <div class="felt"></div>
    <div class="center">
      <div class="board" id="board"></div>
      <div class="pot">Банк <b>20</b></div>
    </div>
  </div>
  <div class="hint" style="position:static;margin-top:12px">Тапни место — пусто/занято · Тяни <b style="color:var(--gold)">D</b> на другое место</div>

  <div class="me">
    <div class="cards" id="mine"></div>
    <div class="money">
      <div class="field">Ставка против тебя <b>5</b></div>
      <div class="field">Соперников в игре <b>2</b></div>
    </div>
  </div>

  <div class="verdict">
    <div class="row"><div class="action">КОЛЛ <span>5</span></div><div class="eq">39 %<small>шанс</small></div></div>
    <div class="bar"><div class="fill"></div><div class="need"></div></div>
    <div class="tags"><span>Старшая карта</span><span>Флеш-дро · 9 аутов</span></div>
    <div class="why">Шанс 39 %, а колл требует 20 % — уравнивать выгодно.</div>
  </div>

  <div class="sheet-dim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <h2>Карта флопа 3 из 3</h2>
    <div class="chosen">Уже на столе: <span id="already"></span></div>
    <div class="ranks" id="ranks"></div>
    <div class="suits"><div class="suit-s">♠</div><div class="suit-h">♥</div><div class="suit-d used">♦</div><div class="suit-c">♣</div></div>
  </div>

<script type="module">
  import { card, placeSeats } from './common.js';
  const t = document.getElementById('table');
  placeSeats(t, { dealer: 'Дилер',
    render: (n, pos, empty) => `<div class="disc">${empty ? '—' : pos}</div><div class="name">${n}</div>` });
  document.getElementById('board').innerHTML = ['As', '7s', '2d'].map((c) => card(c)).join('') + card('2d', 'empty').replace(/<b>.*<\/i>/, '') + card('2d', 'empty').replace(/<b>.*<\/i>/, '');
  document.getElementById('mine').innerHTML = card('Js', 'big') + card('Ts', 'big');
  document.getElementById('already').innerHTML = card('As') + ' ' + card('7s');
  document.getElementById('ranks').innerHTML = ['A','K','Q','J','10','9','8','7','6','5','4','3','2']
    .map((r) => `<div class="${r === '2' ? 'on' : ''}">${r}</div>`).join('');
</script>
</body>
</html>
